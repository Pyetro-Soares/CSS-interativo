<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa Interativa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="arquivos/caixa.ico" type="image/x-icon">
</head>
<body>
    <article id="menuLateral" class="escuro2">
        <button id="btn">Tema</button>
    </article>
    <div id="campoInput" class="escuro3">
        <div class="cardInput escuro4">
            <h2>Selecione uma color</h2>
            <input type="color" id="color">
            <button id="voltarCor" class="escuro5">Clique aqui pra voltar a cor ao normal</button>
        </div>
            <div class="cardInput escuro4">
                <textarea class="escuro4" id="menssagem" placeholder="Digite seu texto aqui"></textarea>
            </div>
            <div class="cardInput escuro4">
                <h2>Altura</h2>
                <input type="range" value="100" class="input" min="100" max="500" id="altura">
            </div>
            <div class="cardInput escuro4">
                <h2>Curvatura da borda</h2>
                <input type="range" value="10" class="input" id="curvaturaBorda">
            </div>
    </div>
    <article id="sesaoCaixa" class="escuro3">
        <div id="caixa" class="escuro5">
            <p id="textoDaMenssagem"></p>
        </div>
    </article>
    <script src="script.js"></script>
</body>
</html>
